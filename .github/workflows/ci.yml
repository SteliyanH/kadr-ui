name: CI

# `develop` and `main` require the `test` check (branch protection). A workflow
# that only ran on `workflow_dispatch` could never produce it: manually
# dispatched runs are not reported as a PR status, so every pull request sat
# BLOCKED and the only way to land anything was an admin override. Restored on
# `pull_request` so the required check exists where protection actually needs
# it — on the PR's head commit.
#
# Runner minutes are shared, so the trigger set stays deliberately narrow:
#
#   - `pull_request` only, NOT `push`. A post-merge push run would re-test code
#     the PR already tested. Where merge commits differ from PR heads it is
#     `strict: true` in branch protection (require branches up to date) that
#     catches it, not a second full run.
#   - `concurrency` cancels superseded runs, so iterating on a PR costs one run
#     rather than one per push.
#   - `workflow_dispatch` stays for manual runs on a branch.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15

    # The suite runs in well under a minute. Without a cap, a hung process runs
    # to GitHub's 360-minute default — six hours of macOS runner time, billed at
    # 10x the Linux rate, for a job that should be over in one. Not
    # hypothetical: kadr wedged exactly this way on 2026-08-17 and had to be
    # cancelled by hand after 33 minutes.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # Pinned rather than `latest-stable`, so a red run means the code
          # changed and not that the runner image moved. 26.3 is what the last
          # green runs used.
          xcode-version: '26.3'
      - run: swift test
