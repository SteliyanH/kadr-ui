name: CI

# `develop` and `main` require the `test` check (branch protection). A workflow
# that only ran on `workflow_dispatch` could never produce it: manually
# dispatched runs are not reported as a PR status, so every pull request sat
# BLOCKED and the only way to land anything was an admin override. Restored on
# `pull_request` so the required check exists where protection actually needs
# it — on the PR's head commit.
#
# Runner minutes are shared, so the trigger set stays deliberately narrow:
#
#   - `pull_request` only, NOT `push`. A post-merge push run would re-test code
#     the PR already tested. Where merge commits differ from PR heads it is
#     `strict: true` in branch protection (require branches up to date) that
#     catches it, not a second full run.
#   - `concurrency` cancels superseded runs, so iterating on a PR costs one run
#     rather than one per push.
#   - `workflow_dispatch` stays for manual runs on a branch.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15

    # The suite runs in well under a minute. Without a cap, a hung process runs
    # to GitHub's 360-minute default — six hours of macOS runner time, billed at
    # 10x the Linux rate, for a job that should be over in one. Not
    # hypothetical: kadr wedged exactly this way on 2026-08-17 and had to be
    # cancelled by hand after 33 minutes.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # Pinned rather than `latest-stable`, so a red run means the code
          # changed and not that the runner image moved. 26.3 is what the last
          # green runs used.
          xcode-version: '26.3'

      # README examples had drifted from the API: the Quick Start called a
      # TimelineView initialiser deprecated since v0.10, and the Appearance
      # example passed its arguments in an order that does not compile.
      # Tools/readme-snippets.sh copies every ```swift block into
      # Examples/ReadmeSnippets.swift, which the KadrUIExamples target builds,
      # with warnings as errors, on macOS in `swift test` and on iOS below.
      # This step fails if that copy is stale, so a README edit cannot skip
      # the compiler.
      - name: README snippets are current
        run: Tools/readme-snippets.sh --check

      - run: swift test

      # `swift test` runs on macOS, where every `#if os(iOS)` and
      # `#if canImport(UIKit)` body is excluded — 121 lines here. This package
      # compiles for iOS today; nothing was checking that it stayed that way.
      #
      # kadr-audio had the identical gap and its iOS slice did not compile at all,
      # through six releases, with a green suite the whole time. Prevention here,
      # not a fix.
      #
      # `KadrUI-Package` builds the library and the README examples. Xcode only
      # generates an all-targets scheme for a package with more than one
      # product, and the examples are deliberately not a product, so this one
      # is checked in under .swiftpm/xcode/xcshareddata/xcschemes. It leaves
      # out the test target: `swift test` covers it, and its snapshot and
      # inspection dependencies would only add build time here.
      - name: Build for iOS
        run: xcodebuild -scheme KadrUI-Package -destination 'generic/platform=iOS' -quiet build
